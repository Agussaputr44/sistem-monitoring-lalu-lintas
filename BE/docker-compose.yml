version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: local-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: traffic_monitoring
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: local-redis
    ports:
      - "6379:6379"
    restart: always

  fastapi:
    build: .
    container_name: traffic-fastapi
    ports:
      - "8000:8000"
    environment:
      DB_USER: user
      DB_PASSWORD: password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: traffic_monitoring
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/app
    command: >
      sh -c "
      apt-get update && apt-get install -y netcat-openbsd &&
      until nc -z mysql 3306; do echo '⏳ Waiting for MySQL...'; sleep 2; done &&
      until nc -z redis 6379; do echo '⏳ Waiting for Redis...'; sleep 2; done &&
      uvicorn app_optimation.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  mysql_data:
